<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2><br>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rubix cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Card Name<span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required><br>
            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input id="card-number" name="card-number" type="text" required aria-describedby="card-number-help"><span id="card-number-help">ex: 1111-2222-3333-4444</span>

        </form>
    </section>
</body>

</html>
